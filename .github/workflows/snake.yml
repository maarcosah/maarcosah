name: generate snake animation

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: maarcosah
          outputs: |
            assets/snake.svg
            assets/snake-dark.svg?palette=github-dark

      - run: |
          git config user.name "maarcosah"
          git config user.email "149399722+maarcosah@users.noreply.github.com"
          git add assets/snake.svg assets/snake-dark.svg
          git diff --staged --quiet || git commit -m "chore: update contribution snake"
          git push
