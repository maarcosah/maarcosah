name: generate real stats

on:
  schedule:
    - cron: "17 3 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/gen_stats.py
      - .github/workflows/stats.yml

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/gen_stats.py
        env:
          STATS_PAT: ${{ secrets.STATS_PAT }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dark.svg assets/stats-light.svg
          git diff --staged --quiet || git commit -m "chore: update GitHub stats"
          git push
